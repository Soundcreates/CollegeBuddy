name: CollegeBuddy
description: "App that makes college students life easier"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.1.5
  provider: ^6.0.5
  intl: ^0.18.1
  google_fonts: ^6.1.0
  animate_do: ^3.1.2
  flutter_animate: ^4.2.0
  lucide_icons: ^0.257.0
  app_links: ^3.5.0
  url_launcher: ^6.3.0
  flutter_secure_storage: ^9.0.0
  home_widget: 0.7.0
  path_provider: ^2.1.5
  http: ^1.6.0
  flutter_widget_from_html: ^0.17.2
  shared_preferences: ^2.3.0
  # Offline-first cache layer
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  logging: ^1.2.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/branding/collegebuddy-mark.png
