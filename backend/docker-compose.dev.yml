services:
  db:
    image: postgres:15
    container_name: collegebuddy_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CollegeBuddy}
      POSTGRES_DB: ${DB_NAME:-CollegeBuddyDB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - collegebuddy_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: collegebuddy_backend
    depends_on:
      db:
        condition: service_healthy
      python:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - .:/backend:Z
    command: air
    networks:
      - collegebuddy_network
    env_file:
      - .env
    environment:
      # Force local Postgres from this compose file (ignore DATABASE_URL / MODE=production from .env)
      MODE: development
      DATABASE_URL: ""
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-CollegeBuddy}
      DB_NAME: ${DB_NAME:-CollegeBuddyDB}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Kolkata}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-8080}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      EXTENSION_ID: ${EXTENSION_ID}
      PYTHON_AI_SERVICE_URL: http://python:8000/text-classification
      SCRAPER_SERVICE_URL: http://python:8000
      # Google OAuth redirect must hit THIS stack (not production Render).
      # Set DEV_BACKEND_URL in .env to your ngrok HTTPS origin (same as mobile BACKEND_BASE_URL).
      BACKEND_URL: ${DEV_BACKEND_URL:-http://localhost:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  python:
    build:
      context: ../scraperService
      dockerfile: Dockerfile
    container_name: collegebuddy_python
    ports:
      - "8000:8000"
    volumes:
      - ../scraperService:/python:Z
    command: uvicorn app.app:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../scraperService/.env
    environment:
      HF_TIMEOUT_SECONDS: ${HF_TIMEOUT_SECONDS:-20}
      CLASSIFY_BUDGET_SECONDS: ${CLASSIFY_BUDGET_SECONDS:-45}
    networks:
      - collegebuddy_network

volumes:
  pgdata:

networks:
  collegebuddy_network:
