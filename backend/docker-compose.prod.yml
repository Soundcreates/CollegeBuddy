# Self-hosted production stack.
# Required in backend/.env (or the host environment):
#   BACKEND_URL          public HTTPS origin (Google OAuth redirect base, no trailing slash)
#   JWT_SECRET           OAUTH_CLIENT_ID  OAUTH_CLIENT_SECRET
#   DB_USER DB_PASSWORD DB_NAME
# Optional:
#   DATABASE_URL         managed Postgres (e.g. Neon). If unset, uses the compose `db` service.
#   EXTENSION_ID PORT DB_TIMEZONE
services:
  db:
    image: postgres:15
    container_name: collegebuddy_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-CollegeBuddyDB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Do not publish Postgres to the host in production; other services reach it on the network.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - collegebuddy_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collegebuddy_backend
    depends_on:
      db:
        condition: service_healthy
      python:
        condition: service_started
    ports:
      - "${PORT:-8080}:8080"
    # No bind-mount / no `air` — run the compiled binary from Dockerfile.
    networks:
      - collegebuddy_network
    env_file:
      - .env
    environment:
      MODE: production
      # Public URL used for Google OAuth redirect_uri ({BACKEND_URL}/api/auth/google/callback).
      # Must NOT be DEV_BACKEND_URL / ngrok — use the real deploy origin (e.g. Render / your domain).
      BACKEND_URL: ${BACKEND_URL:?BACKEND_URL is required}
      # Prefer managed DATABASE_URL when set; otherwise the compose Postgres service.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-CollegeBuddyDB}?sslmode=disable}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-CollegeBuddyDB}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Kolkata}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: ${PORT:-8080}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:?OAUTH_CLIENT_ID is required}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:?OAUTH_CLIENT_SECRET is required}
      EXTENSION_ID: ${EXTENSION_ID:-}
      PYTHON_AI_SERVICE_URL: http://python:8000/text-classification
      SCRAPER_SERVICE_URL: http://python:8000
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  python:
    build:
      context: ../scraperService
      dockerfile: Dockerfile
    container_name: collegebuddy_python
    expose:
      - "8000"
    # Production: image CMD only (no --reload, no source bind-mount).
    env_file:
      - ../scraperService/.env
    environment:
      HF_TIMEOUT_SECONDS: ${HF_TIMEOUT_SECONDS:-20}
      CLASSIFY_BUDGET_SECONDS: ${CLASSIFY_BUDGET_SECONDS:-45}
    restart: unless-stopped
    networks:
      - collegebuddy_network

volumes:
  pgdata:

networks:
  collegebuddy_network:
