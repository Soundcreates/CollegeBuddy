version: "3.9"

services:
  db:
    image: postgres:15
    container_name: collegebuddy_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: 
      - collegebuddy_network

  backend:
    build: .
    depends_on:
      - db
    container_name: collegebuddy_backend
    ports:
      - "8080:8080"
    volumes:
      - .:/backend:Z
    command: air
    networks: 
      - collegebuddy_network
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_TIMEZONE: ${DB_TIMEZONE}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      EXTENSION_ID: ${EXTENSION_ID}
      DATABASE_URL: ${DATABASE_URL}

volumes:
  pgdata:

networks:
  collegebuddy_network:
